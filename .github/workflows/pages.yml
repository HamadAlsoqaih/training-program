name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Program data fidelity checks
        run: node tests/fidelity.mjs
      - name: Schedule checks
        run: node tests/schedule.mjs
      - name: Jump volume analytics checks
        run: node tests/analytics.mjs
      - name: Deload week checks
        run: node tests/deload.mjs
      - name: Workout and backup fix checks
        run: node tests/fixes.mjs
      - name: Week organizer checks
        run: node tests/organize.mjs
      - name: Prep week checks
        run: node tests/prep.mjs
      - name: Edge case checks
        run: node tests/edge.mjs
      - name: Notification server checks
        run: npm ci --no-audit --no-fund && node tests/notify.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate app icons
        run: node scripts/gen-icons.mjs
      - name: Publish to gh-pages branch (Pages serves from it)
        run: |
          mkdir -p /tmp/site
          cp -r index.html css js icons manifest.webmanifest sw.js /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -b gh-pages
          git config user.name "HamadAlsoqaih"
          git config user.email "129183241+HamadAlsoqaih@users.noreply.github.com"
          git add -A
          git commit -m "Deploy site from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
