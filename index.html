<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Hamad's Training</title>
  <meta name="description" content="15-week volleyball strength & plyometric training program tracker" />
  <meta name="theme-color" content="#0b0f16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Training" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <main id="view" aria-live="polite"></main>
    <div id="restbar"></div>
    <nav id="tabbar" aria-label="Main">
      <a href="#/today" data-tab="today">
        <svg viewBox="0 0 24 24"><path d="M13 2 4.3 13.1c-.4.5 0 1.2.6 1.2H11l-1 7.6c-.1.8.9 1.2 1.4.5L20 11.3c.4-.5 0-1.2-.6-1.2H13l1.1-7.5c.1-.8-.9-1.2-1.4-.6Z"/></svg>
        <span>Today</span>
      </a>
      <a href="#/program" data-tab="program">
        <svg viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm1 4h8v2H8V7Zm0 4h8v2H8v-2Zm0 4h5v2H8v-2Z"/></svg>
        <span>Program</span>
      </a>
      <a href="#/progress" data-tab="progress">
        <svg viewBox="0 0 24 24"><path d="M4 20V10h3v10H4Zm6.5 0V4h3v16h-3ZM17 20v-7h3v7h-3Z"/></svg>
        <span>Progress</span>
      </a>
      <a href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 4a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.4 1a7.6 7.6 0 0 0-2-1.2L16 3h-4l-.4 2.6a7.6 7.6 0 0 0-2 1.2l-2.5-1-2 3.5 2.1 1.5A7 7 0 0 0 7 12c0 .4 0 .8.1 1.2L5 14.7l2 3.5 2.4-1c.6.5 1.3.9 2 1.2L12 21h4l.4-2.6a7.6 7.6 0 0 0 2-1.2l2.4 1 2-3.5-2-1.5c.2-.4.2-.8.2-1.2Z" transform="translate(-2 0)"/></svg>
        <span>Settings</span>
      </a>
    </nav>
    <div id="sheet-root"></div>
    <div id="flash"></div>
    <div id="toast-root"></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
